<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BkgTracker — Family Dashboard</title>

  <!-- Leaflet map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase SDK (v10 modular CDN) -->
  <script type="module">
    import { initializeApp }        from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
                                    from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
    import { getFirestore, collection, query, where, orderBy, limit, getDocs }
                                    from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // ── Map setup ────────────────────────────────────────────────────────────────
    const map = L.map("map").setView([20, 78], 5);

    // Try ESRI World Street Map (very reliable, used by many enterprise apps)
    const tiles = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ',
      crossOrigin: true
    });

    tiles.on('tileerror', function(error) {
      console.error('Tile failed to load:', error);
      document.getElementById('status').textContent = 'Map tiles error — check console';
    });

    tiles.on('load', function() {
      console.log('Tiles loaded successfully');
    });

    tiles.addTo(map);
    console.log('Map initialized, tile layer added');

    // Colour palette — one per user email
    const COLOURS = ["#1565C0","#C62828","#2E7D32","#F57F17","#6A1B9A","#00838F"];
    const userColours = {};
    let colourIdx = 0;
    function colourFor(email) {
      if (!userColours[email]) userColours[email] = COLOURS[colourIdx++ % COLOURS.length];
      return userColours[email];
    }

    // ── Auth state ───────────────────────────────────────────────────────────────
    onAuthStateChanged(auth, user => {
      if (user) {
        document.getElementById("auth-section").style.display = "none";
        document.getElementById("main-section").style.display = "flex";
        document.getElementById("user-email").textContent = user.email;
        // CRITICAL: Leaflet needs size recalc after container becomes visible
        setTimeout(() => { map.invalidateSize(); }, 100);
        loadLocations();
      } else {
        document.getElementById("auth-section").style.display = "flex";
        document.getElementById("main-section").style.display = "none";
      }
    });

    window.signInWithGoogle = async function () {
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
      } catch (e) {
        alert("Sign-in failed: " + e.message);
      }
    };

    window.signOutUser = async function () {
      await signOut(auth);
    };

    // ── Load and render locations ─────────────────────────────────────────────────
    let markers = [];
    let polylines = [];
    
    // Track which users are visible (email -> boolean)
    let visibleUsers = new Set();
    let allUsers = []; // Store all discovered users
    let byUser = {};   // Loaded points grouped by email/uid
    let showWaypoints = false; // Toggle for per-point markers
    let waypointMarkers = [];
    let cachedPoints = {};     // email/uid -> array of fetched points
    let lastFetchMs = 0;       // Timestamp of last fetch start
    let oldestCachedMs = 0;    // Oldest point timestamp currently in cache
    
    function toggleUser(email) {
      if (visibleUsers.has(email)) {
        visibleUsers.delete(email);
      } else {
        visibleUsers.add(email);
      }
      updateUserToggles();
      loadLocations();
    }
    window.toggleUser = toggleUser;

    function updateWaypointButton() {
      const btn = document.getElementById('points-toggle');
      if (btn) btn.textContent = showWaypoints ? 'Points: on' : 'Points: off';
    }

    function renderWaypoints() {
      waypointMarkers.forEach(m => map.removeLayer(m));
      waypointMarkers = [];
      if (!showWaypoints) return;

      Object.entries(byUser).forEach(([email, points]) => {
        if (!visibleUsers.has(email)) return;
        const colour = colourFor(email);
        points.forEach(p => {
          const ptIcon = L.divIcon({
            className: "",
            html: `<div style="width:8px;height:8px;border-radius:50%;background:${colour};"></div>`,
            iconAnchor: [4, 4]
          });
          const pm = L.marker([p.lat, p.lon], { icon: ptIcon, interactive: true });
          const pts = new Date(p._tsMs).toLocaleString();
          const pspd = p.speed != null ? `${p.speed.toFixed(1)} km/h` : "?";
          const palt = p.altitude != null ? `${p.altitude.toFixed(0)} m` : "?";
          pm.bindPopup(`<b>${email}</b><br>±${p.accuracy?.toFixed(0) ?? "?"}m  ${pspd}  alt ${palt}<br>${pts}`);
          pm.addTo(map);
          waypointMarkers.push(pm);
        });
      });
    }

    function toggleWaypoints() {
      showWaypoints = !showWaypoints;
      updateWaypointButton();
      renderWaypoints();
    }
    window.toggleWaypoints = toggleWaypoints;

    function updateUserToggles() {
      const container = document.getElementById('user-toggles');
      if (!container) return;
      
      container.innerHTML = '';
      allUsers.forEach(email => {
        const isVisible = visibleUsers.has(email);
        const colour = userColours[email] || COLOURS[0];
        const btn = document.createElement('button');
        btn.className = `user-toggle ${isVisible ? 'active' : 'inactive'}`;
        btn.style.borderColor = colour;
        btn.style.background = isVisible ? colour : 'transparent';
        btn.style.color = isVisible ? 'white' : colour;
        btn.textContent = email.split('@')[0]; // Show just username part
        btn.title = email;
        btn.onclick = () => toggleUser(email);
        container.appendChild(btn);
      });
    }

    async function loadLocations() {
      const hoursBack = parseInt(document.getElementById("hours-select").value, 10);
      const since     = Date.now() - hoursBack * 3600 * 1000;
      const fetchStartMs = Date.now();
      const isFullFetch = oldestCachedMs === 0 || since < oldestCachedMs;

      document.getElementById("status").textContent = "Loading…";

      // Clear display overlays (cache stays in memory)
      markers.forEach(m => map.removeLayer(m));
      polylines.forEach(p => map.removeLayer(p));
      waypointMarkers.forEach(m => map.removeLayer(m));
      markers = []; polylines = []; waypointMarkers = [];

      // Step 1: list all user documents under /locations to get UIDs
      let userDocs;
      try {
        userDocs = await getDocs(collection(db, "locations"));
      } catch (e) {
        document.getElementById("status").textContent = "Error listing users: " + e.message;
        return;
      }

      // If window widened, discard cache and fetch the full window fresh
      if (isFullFetch) {
        cachedPoints = {};
      }

      const fetchSince = isFullFetch ? since : lastFetchMs;
      const discoveredUsers = [];
      let pointsAdded = 0;

      // Step 2: fetch each user's records subcollection (full window or incremental)
      await Promise.all(userDocs.docs.map(async userDoc => {
        const uid = userDoc.id;
        const recRef = collection(db, "locations", uid, "records");

        const q = query(
          recRef,
          where("timestamp", ">=", fetchSince),
          orderBy("timestamp", "desc")
        );

        try {
          const snap = await getDocs(q);
          if (isFullFetch) {
            snap.forEach(d => {
              const data = d.data();
              data._id = d.id;
              const raw = data.timestamp;
              data._tsMs = raw?.toMillis ? raw.toMillis() : Number(raw);
              const key = data.email || uid;
              if (!discoveredUsers.includes(key)) discoveredUsers.push(key);
              if (!cachedPoints[key]) cachedPoints[key] = [];
              cachedPoints[key].push(data);
              pointsAdded++;
            });
          } else {
            // Append only new points; dedupe by Firestore doc id
            snap.forEach(d => {
              const data = d.data();
              data._id = d.id;
              const raw = data.timestamp;
              data._tsMs = raw?.toMillis ? raw.toMillis() : Number(raw);
              const key = data.email || uid;
              if (!discoveredUsers.includes(key)) discoveredUsers.push(key);
              if (!cachedPoints[key]) cachedPoints[key] = [];
              if (!cachedPoints[key].some(p => p._id === data._id)) {
                cachedPoints[key].push(data);
                pointsAdded++;
              }
            });
          }
        } catch (e) {
          console.warn("Could not fetch records for uid", uid, e.message);
        }
      }));

      lastFetchMs = fetchStartMs;
      // After a full fetch we know the cache covers from 'since' to now because the
      // query was timestamp >= since with no limit. Use that as coverage marker
      // rather than the oldest returned point, which may be later if data is sparse.
      if (isFullFetch) oldestCachedMs = since;

      // Update user list and toggles if we discovered new users
      const newUsers = discoveredUsers.filter(u => !allUsers.includes(u));
      if (newUsers.length > 0) {
        allUsers = [...allUsers, ...newUsers];
        newUsers.forEach(u => visibleUsers.add(u));
        updateUserToggles();
      }

      // Build the display dataset from cache filtered by the current window
      byUser = {};
      let totalPoints = 0;
      Object.entries(cachedPoints).forEach(([key, points]) => {
        const filtered = points.filter(p => p._tsMs >= since);
        if (filtered.length > 0) {
          byUser[key] = filtered.sort((a, b) => a._tsMs - b._tsMs);
          totalPoints += filtered.length;
        }
      });

      const bounds = [];
      const legend = document.getElementById("legend-list");
      legend.innerHTML = "";

      Object.entries(byUser).forEach(([email, points]) => {
        // Skip if user is not selected for display
        if (!visibleUsers.has(email)) return;
        const colour = colourFor(email);
        const latLngs = points.map(p => [p.lat, p.lon]);

        // Polyline trail
        const pl = L.polyline(latLngs, { color: colour, weight: 3, opacity: 0.7, interactive: false }).addTo(map);
        polylines.push(pl);
        bounds.push(...latLngs);

        // Latest position marker
        const last = points[points.length - 1];
        const icon = L.divIcon({
          className: "",
          html: `<div style="width:14px;height:14px;border-radius:50%;background:${colour};
                 border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>`,
          iconAnchor: [7, 7]
        });
        const m = L.marker([last.lat, last.lon], { icon }).addTo(map);
        const ts = new Date(last._tsMs).toLocaleString();
        const spd = last.speed != null ? `${last.speed.toFixed(1)} km/h` : "?";
        const alt = last.altitude != null ? `${last.altitude.toFixed(0)} m` : "?";
        m.bindPopup(`<b>${email}</b><br>±${last.accuracy?.toFixed(0) ?? "?"}m  ${spd}  alt ${alt}<br>${ts}`);
        markers.push(m);

        // Legend entry
        const li = document.createElement("li");
        li.style.color = colour;
        li.innerHTML = `<span style="font-weight:600">${email}</span> — ${points.length} pts`;
        legend.appendChild(li);
      });

      if (bounds.length > 0) map.fitBounds(bounds, { padding: [30, 30] });
      const userCount = Object.keys(byUser).length;
      const modeLabel = isFullFetch ? "" : " (incremental)";
      const addedLabel = pointsAdded > 0 ? ` — ${pointsAdded} new fetched` : "";
      document.getElementById("status").textContent = userCount === 0
        ? "No data found for selected time range."
        : `Loaded ${totalPoints} points for ${userCount} user(s)${modeLabel}${addedLabel}.`;

      updateWaypointButton();
      renderWaypoints();
    }

    window.loadLocations = loadLocations;

    // ── CSV export ──────────────────────────────────────────────────────────────
    window.exportCsv = function () {
      // Collect visible points already loaded in byUser
      const rows = [];
      Object.entries(byUser).forEach(([email, points]) => {
        if (!visibleUsers.has(email)) return;
        points.sort((a, b) => a._tsMs - b._tsMs);
        points.forEach(p => {
          const tsIso = new Date(p._tsMs).toISOString();
          rows.push({
            timestamp_utc: tsIso,
            email,
            lat: p.lat,
            lon: p.lon,
            accuracy_m: p.accuracy ?? "",
            speed_kmh: p.speed ?? "",
            altitude_m: p.altitude ?? "",
            bearing_deg: p.bearing ?? ""
          });
        });
      });

      if (rows.length === 0) {
        alert("No visible points to export.");
        return;
      }

      const headers = ["timestamp_utc", "email", "lat", "lon", "accuracy_m", "speed_kmh", "altitude_m", "bearing_deg"];
      const csv = [
        headers.join(","),
        ...rows.map(r => headers.map(h => {
          const v = r[h];
          const s = v == null ? "" : String(v);
          // Escape values that contain commas or quotes
          if (s.includes(",") || s.includes('"') || s.includes("\n")) {
            return '"' + s.replace(/"/g, '""') + '"';
          }
          return s;
        }).join(","))
      ].join("\n");

      const hoursBack = document.getElementById("hours-select").value;
      const stamp = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 12);
      const filename = `bkgtracker_${hoursBack}h_${stamp}.csv`;

      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #f0f4f8; color: #1a1c1e; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1565c0; color: white; padding: 12px 20px;
             display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: .5px; }
    header span { font-size: .85rem; opacity: .85; }
    header button { background: rgba(255,255,255,.15); border: none; border-radius: 6px;
                    color: white; padding: 6px 14px; cursor: pointer; font-size: .85rem; }
    header button:hover { background: rgba(255,255,255,.25); }
    #auth-section { flex: 1; display: flex; flex-direction: column;
                    align-items: center; justify-content: center; gap: 16px; }
    #auth-section h2 { font-size: 1.3rem; color: #1565c0; }
    #auth-section button { padding: 12px 28px; background: #1565c0; color: white;
                           border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    #auth-section button:hover { background: #0d47a1; }
    #main-section { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    #controls { background: white; border-bottom: 1px solid #e0e0e0;
                padding: 8px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    #controls label { font-size: .85rem; color: #555; }
    #controls select, #controls button { padding: 6px 12px; border-radius: 6px;
                                          border: 1px solid #ccc; font-size: .85rem; cursor: pointer; }
    #controls button { background: #1565c0; color: white; border-color: #1565c0; }
    #controls button:hover { background: #0d47a1; }
    #status { font-size: .8rem; color: #777; margin-left: auto; }
    #map { flex: 1; min-height: 300px; width: 100%; height: 100%; position: relative; }
    .leaflet-container { height: 100% !important; width: 100% !important; }
    #legend { background: white; border-top: 1px solid #e0e0e0;
              padding: 8px 16px; font-size: .82rem; max-height: 80px; overflow-y: auto; }
    #legend-list { display: flex; gap: 16px; list-style: none; flex-wrap: wrap; }
    #user-toggles { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    #user-toggles button { padding: 4px 10px; border-radius: 12px; border: 2px solid; font-size: .75rem; cursor: pointer; transition: all 0.2s; }
    #user-toggles button:hover { opacity: 0.8; }
    .user-toggle.active { font-weight: 600; }
    .user-toggle.inactive { opacity: 0.5; }
    #toggle-label { font-size: .85rem; color: #555; margin-right: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>📍 BkgTracker — Family Map</h1>
    <div id="header-user" style="display:flex;align-items:center;gap:10px">
      <span id="user-email"></span>
      <button onclick="signOutUser()">Sign Out</button>
    </div>
  </header>

  <!-- Sign-in state -->
  <div id="auth-section">
    <h2>BkgTracker Family Dashboard</h2>
    <p style="color:#555;font-size:.95rem">Sign in with a family Google account to view locations.</p>
    <button onclick="signInWithGoogle()">Sign in with Google</button>
  </div>

  <!-- Main dashboard -->
  <div id="main-section">
    <div id="controls">
      <label for="hours-select">Show last</label>
      <select id="hours-select">
        <option value="1" selected>1 hour</option>
        <option value="6">6 hours</option>
        <option value="24">24 hours</option>
        <option value="72">3 days</option>
        <option value="168">7 days</option>
      </select>
      <button onclick="loadLocations()">Refresh</button>
      <button onclick="exportCsv()">Export CSV</button>
      <button id="points-toggle" onclick="toggleWaypoints()">Points: off</button>
      <span id="toggle-label">Users:</span>
      <span id="user-toggles"></span>
      <span id="status"></span>
    </div>
    <div id="map"></div>
    <div id="legend">
      <ul id="legend-list"></ul>
    </div>
  </div>
</body>
</html>
